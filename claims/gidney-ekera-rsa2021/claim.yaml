assessment:
  reproduction_status: fully_reproduced
  summary_plain: >-
    QAC built the paper's modular exponentiation as a Q# circuit, checked it on small instances, and
    counted it at full size with Table 3's parameters: {{ reproductions.0.figures.toffoli_count.value | sci }}
    Toffoli gates per run, against the paper's {{ reported.figures.toffoli_count.value | sci }}. The
    paper's layout and timing model, rebuilt from the text and applied to those counts, gives
    {{ reproductions.0.figures.physical_qubits.value | million }} physical qubits and an expected
    {{ reproductions.0.figures.runtime_seconds.value | hours }}, against the paper's
    {{ reported.figures.physical_qubits.value | million }} and {{ reported.figures.runtime_seconds.value | hours }}.
  what_this_shows:
    - The construction of Section 2, built as a circuit, computes modular exponentiations exactly on every small instance checked, and order finding with it lands on the ideal frequency peaks, so the arithmetic keeps the phases Shor's algorithm needs.
    - At full size with Table 3's parameters, the circuit needs the Toffoli count of Table 1 to within a fraction of a percent.
    - The paper's layout and timing model, rebuilt from its text and applied to the circuit's counts, gives a qubit count a little above the headline and a runtime a little below it; the extra qubits match the paper's own hand estimate in Sec. 2.14.
    - The QDK resource estimator, given the same counts, independently chooses the same code distance and a qubit count close to the headline.
  what_this_does_not_show:
    - The title's 20 million qubits rest on a more compact factory layout at level-1 distance 15 that the text does not describe; the rebuilt layout uses the layout the text gives, at level-1 distance 17.
    - The distillation error per CCZ state is taken from the paper's aggregate figure, not from a simulation of the factory.
    - The runtime depends on reaction-limited additions running in parallel runway pieces; the QDK estimator, which runs Toffolis one after another without a reaction time, gives a runtime several times longer, so the 8-hour figure is specific to that architecture.
    - No logical-qubit comparison is made, because the paper prints only an asymptotic expression for it.
    - The full-size circuit is counted, not simulated; the end-to-end order-finding check uses a small modulus.
  findings:
    - aspect: toffoli_count
      verdict: matches
      note: Counted from the built circuit with Table 3's parameters; Table 1's figure is per run and rounded to two significant figures.
    - aspect: physical_qubits
      verdict: within_factor
      note: The paper's layout as described in the text, which Sec. 2.14 itself puts above the headline; the headline uses a more compact factory layout from the authors' script.
    - aspect: runtime_seconds
      verdict: within_factor
      note: The paper's per-operation timing applied to the circuit's counts, with the retry risk from the paper's error model; somewhat shorter than the rounded headline.
    - aspect: code_distance
      verdict: not_compared
      note: Imposed from Table 3 in the rebuilt layout; the QDK estimator, choosing freely over the paper's search range, selects the same distance.
    - aspect: logical_qubits
      verdict: not_compared
      note: The paper prints only the expression 3n + 0.002n lg n; the circuit's peak is recorded in results.json.
  classical_status: not_solved_classically_at_target_accuracy
  classical_status_note: No 2048-bit RSA integer has been publicly factored by classical means.

