schema_version: "1.0"
id: gidney-ekera-rsa2021
title: RSA-2048 factoring resource estimate with windowed arithmetic, coset representation, and oblivious carry runways (Gidney and Ekerå, 2021)
short_title: RSA-2048 resource estimate (Gidney & Ekerå 2021)
headline: A 2048-bit RSA integer could be factored in about 8 hours with about 20 million noisy qubits.
claim_type: literature_resource_estimate
domain: cryptanalysis
taxonomy: application

source:
  type: journal_article
  title: How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits
  authors:
    - Craig Gidney
    - Martin Ekerå
  author_list_complete: true
  year: 2021
  venue:
    name: Quantum
    volume: "5"
