assertion:
  what_is_claimed: >-
    Factoring a 2048-bit RSA integer with Ekerå and Håstad's algorithm, using windowed arithmetic, the
    coset representation of modular integers, and oblivious carry runways, takes about 2.7e9 Toffoli
    gates per run; on a planar grid of qubits with nearest-neighbour connectivity, a physical gate error
    rate of 1e-3, a 1 µs surface-code cycle, and a 10 µs reaction time, it costs about 20 million
    physical qubits and about 8 hours, including repeated runs.
  workload:
    system: RSA-2048 (2048-bit modulus), factored through Ekerå and Håstad's short discrete logarithm in a single run
    target_observable: factors of a 2048-bit RSA integer
    target_precision:
      value: 0.01
      unit: dimensionless
      locator: "Sec. 2.1, p. 5; Sec. 3.2, p. 16"
      note: >-
        Factoring has no numerical precision target. This is the paper's bound on the classical
        post-processing failing to recover the factors from a correct run ("at least 99%" success),
        recorded because the schema requires a target, as in the rsa2048-gidney-2025 record.
  method: >-
    Ekerå–Håstad short discrete logarithm; windowed modular exponentiation in the coset representation
    with oblivious carry runways, Cuccaro ripple-carry adders and table lookups; semi-classical Fourier
    transform
  architecture_assumed: >-
    Surface code with lattice surgery on a planar grid; Gidney–Fowler CCZ factories with AutoCCZ fixups;
    reaction-limited ripple-carry additions running in parallel runway pieces and code-depth-limited
    lookups (Secs. 2.10-2.14)

